<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070606">
<meta name="description" content="Four elemental hourglasses: lava, rain, wind and mountain.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Zambaara Elements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: full-bleed scene on canvas; a quiet column of controls floats over it (header, element tabs, glass, readout, controls) */
:root{
  --bg:#070606; --ink:#ece6dc; --muted:#a39d93; --faint:#7a746b; --line:rgba(236,230,220,.14); --panel:rgba(13,12,11,.9); --accent:#e8673a;
  --f-display:'Cormorant Garamond','Cormorant',Garamond,Georgia,serif;
  --f-ui:'Manrope','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#bgc,#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.app{position:relative;z-index:1;height:100%;box-sizing:border-box;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.app>*{pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1px solid var(--accent);outline-offset:3px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.mark{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.46em;color:var(--ink)}
.tools{display:flex;gap:2px;margin-right:-10px}
.ico{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:50%;transition:color .3s}
.ico:hover{color:var(--ink)}
.ico[aria-pressed="true"],.fexit button[aria-pressed="true"]{color:var(--accent)}
.ico[aria-pressed="true"] .mute,.fexit [aria-pressed="true"] .mute{display:none}
.ico svg{width:20px;height:20px}
.tabs{display:flex;justify-content:center;gap:18px;margin-top:4px}
.tab{width:48px;height:48px;display:grid;place-items:center;position:relative;color:var(--faint);transition:color .4s}
.tab svg{width:22px;height:22px}
.tab::after{content:"";position:absolute;bottom:3px;left:50%;width:0;height:1px;background:var(--accent);transform:translateX(-50%);transition:width .5s}
.tab[aria-pressed="true"]{color:var(--accent)}
.tab[aria-pressed="true"]::after{width:16px}
/* phone held upside down: the glass stays fixed to the phone; the time turns in place so it stays readable */
.readout{transition:transform .7s cubic-bezier(.65,0,.35,1)}
body.inv .readout{transform:rotate(180deg)}
body.inv .toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transform:translate(-50%,8px) rotate(180deg)}
body.inv .toast.on{transform:translate(-50%,0) rotate(180deg)}
body.inv .fexit{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%) rotate(180deg)}
/* focus mode: only the hourglass remains */
.app>*{transition:opacity .5s ease}
body.focus .app>*{opacity:0;pointer-events:none}
.pad{position:fixed;inset:0;z-index:2;touch-action:none;cursor:grab}
.fexit{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;padding:5px 5px 5px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(10,9,8,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s}
body.focus.reveal .fexit{opacity:1;pointer-events:auto}
.fexit span{font-weight:300;font-size:15px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.fexit button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.fexit svg{width:18px;height:18px}
#glass{flex:1 1 auto;min-height:220px;position:relative;touch-action:none;cursor:grab}
.badge{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);white-space:nowrap;pointer-events:none;transition:opacity .4s}
.readout{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.time{font-weight:200;font-size:clamp(50px,15vw,66px);line-height:.95;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
.status{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;min-height:14px}
.durs{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:10px}
.dur{min-width:44px;height:36px;font-size:14px;font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums;position:relative}
.dur[aria-pressed="true"]{color:var(--ink)}
.dur[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:4px;width:3px;height:3px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.dur.custom{display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.dur.custom svg{width:16px;height:16px}
.time{cursor:pointer}
/* custom time picker */
.tpanel{padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
.tpick{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:18px 0 6px}
.tf{display:flex;flex-direction:column;align-items:center;gap:6px}
.tf input{width:2.6ch;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:200 64px/1 var(--f-ui);text-align:center;font-variant-numeric:tabular-nums;padding:0 0 4px;outline:none;caret-color:var(--accent)}
.tf input:focus{border-bottom-color:var(--accent)}
.tf span{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint)}
.tpick .colon{font:200 54px/1 var(--f-ui);color:var(--muted);padding-bottom:30px}
.tquick{display:flex;justify-content:center;gap:8px;margin:14px 0 20px;flex-wrap:wrap}
.tquick button{height:36px;min-width:52px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tquick button:hover{color:var(--ink)}
.tstart{display:block;width:100%;height:52px;border-radius:14px;background:var(--accent);color:#0b0a10;font-weight:600;font-size:15px;letter-spacing:.08em}
.terr{text-align:center;font-size:12px;color:var(--muted);min-height:16px;margin-top:10px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:6px;padding-bottom:6px}
.ring{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);transition:border-color .3s}
.ring:hover{border-color:rgba(236,230,220,.35)}
.ring svg{width:19px;height:19px}
.play{width:72px;height:72px;position:relative;display:grid;place-items:center;color:var(--ink)}
.play svg.pr{position:absolute;inset:0;width:72px;height:72px;transform:rotate(-90deg)}
.play svg.ic{width:22px;height:22px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-8px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13px;color:var(--ink);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{font-style:normal;color:var(--accent);margin-right:8px}
/* codex sheet */
.sheet{position:fixed;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet[hidden],[hidden]{display:none!important}
.panel{width:100%;max-width:520px;max-height:88%;overflow:auto;box-sizing:border-box;background:rgba(14,13,12,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:32px;letter-spacing:.02em}
.ph button{width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.lede{margin:2px 0 16px;font-size:13px;line-height:1.5;color:var(--muted);max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin-bottom:18px}
.stats div{padding:12px 0;display:flex;flex-direction:column;gap:4px}
.stats div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats b{font-weight:300;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.sec{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.erow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.erow svg{width:22px;height:22px}
.erow .nm{font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1}
.erow .nm small{font-family:var(--f-ui);font-style:normal;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-left:8px}
.bar{height:1px;background:var(--line);margin-top:9px;position:relative}
.bar i{position:absolute;left:0;top:0;height:1px;background:var(--ec)}
.erow .meta{font-size:11px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
.erow .lv{font-family:var(--f-display);font-size:22px;color:var(--ec);text-align:right}
.fins{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fin{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}
.fin[aria-pressed="true"]{border-color:var(--ec);color:var(--ink)}
.fin:disabled{opacity:.35;cursor:default}
.seals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px;margin-top:20px}
.seal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.seal svg{width:46px;height:46px}
.seal b{font-weight:500;font-size:11.5px;line-height:1.25}
.seal span{font-size:10px;line-height:1.35;color:var(--faint)}
.seal.off{opacity:.4}
@media (max-height:640px){.durs{margin-top:4px}.tab{height:42px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="bgc" aria-hidden="true"></canvas>
<canvas id="cv" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <span class="mark">ZAMBAARA</span>
    <div class="tools">
      <button class="ico" id="motionBtn" type="button" aria-label="Allow motion sensors" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><rect x="8" y="3.5" width="8" height="17" rx="2"/><path d="M4.5 8a7 7 0 0 0 0 8M19.5 8a7 7 0 0 1 0 8"/></svg></button>
      <button class="ico" id="musicBtn" type="button" aria-pressed="true" aria-label="Music" title="Music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="mute" d="M3.5 3.5l17 17"/></svg></button>
      <button class="ico" id="codexBtn" type="button" aria-label="Open the Codex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 6.5h7M8.5 17.5h7M9.3 6.5c0 3 5.4 3.6 5.4 5.5s-5.4 2.5-5.4 5.5M14.7 6.5c0 3-5.4 3.6-5.4 5.5s5.4 2.5 5.4 5.5"/></svg></button>
      <button class="ico" id="focusBtn" type="button" aria-label="Focus mode: show only the hourglass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Element"></nav>
  <div id="glass" role="img" aria-label="Hourglass"><div class="badge" id="badge"></div></div>
  <section class="readout">
    <div class="time" id="time" aria-live="off">01:00</div>
    <div class="status" id="status" aria-live="polite"></div>
  </section>
  <div class="durs" id="durs" role="group" aria-label="Length"></div>
  <div class="ctrls">
    <button class="ring" id="resetBtn" type="button" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 3.5v5h5"/></svg></button>
    <button class="play" id="playBtn" type="button" aria-label="Pause">
      <svg class="pr" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34.5" fill="none" stroke="rgba(236,230,220,.16)" stroke-width="1"/><circle id="prog" cx="36" cy="36" r="34.5" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="216.8" stroke-dashoffset="216.8"/></svg>
      <svg class="ic" id="playIc" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3" height="14" rx=".8"/><rect x="14" y="5" width="3" height="14" rx=".8"/></svg>
    </button>
    <button class="ring" id="flipBtn" type="button" aria-label="Flip the glass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V5"/><path d="M3.5 8.5 7 5l3.5 3.5"/><path d="M17 4v15"/><path d="M13.5 15.5 17 19l3.5-3.5"/></svg></button>
  </div>
</div>
<div class="pad" id="pad" hidden></div>
<div class="fexit" id="fexit"><span id="ftime">00:00</span><button type="button" id="fMusic" aria-pressed="true" aria-label="Music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="mute" d="M3.5 3.5l17 17"/></svg></button><button type="button" id="exitFocus" aria-label="Leave focus mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="tsheet" hidden>
  <div class="panel tpanel" role="dialog" aria-modal="true" aria-labelledby="tTitle">
    <div class="ph"><h2 id="tTitle">Custom time</h2><button type="button" id="closeT" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <form id="tform" autocomplete="off">
      <div class="tpick">
        <label class="tf"><input id="tMin" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Minutes"><span>min</span></label>
        <span class="colon" aria-hidden="true">:</span>
        <label class="tf"><input id="tSec" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Seconds"><span>sec</span></label>
      </div>
      <div class="tquick"><button type="button" data-a="-1">−1</button><button type="button" data-a="1">+1</button><button type="button" data-a="5">+5</button><button type="button" data-a="15">+15</button><button type="button" data-a="60">+60</button></div>
      <button class="tstart" type="submit">START</button>
      <div class="terr" id="terr" aria-live="polite"></div>
    </form>
  </div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="codexTitle">
    <div class="ph"><h2 id="codexTitle">Codex</h2><button type="button" id="closeCodex" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="lede">Every minute the sand runs earns essence. Leave the glass untouched for a 1.5× bonus, and flip it within six seconds of emptying to build a chain.</p>
    <div class="stats"><div><b id="stEss">0</b><span>Essence</span></div><div><b id="stStreak">0</b><span>Day streak</span></div><div><b id="stChain">0</b><span>Best chain</span></div></div>
    <p class="sec">Mastery</p>
    <div id="erows"></div>
    <p class="sec" style="margin-top:22px">Seals</p>
    <div class="seals" id="seals"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let rs=(Date.now()&0x7fffffff)||7;
const rnd=()=>{rs^=rs<<13;rs^=rs>>>17;rs^=rs<<5;return(rs>>>0)/4294967296};
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgba(h,a){const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ============ grid ============ */
const W=151,H=260,MID=130,CX=75.5,N=W*H,Y0=6,Y1=H-7,LEN=MID-1-Y0;
const g=new Uint8Array(N),c=new Uint8Array(N),st=new Uint8Array(N),tn=new Uint8Array(N),stamp=new Uint8Array(N);
const wRow=new Float32Array(H),cyl=new Float32Array(N);
const xOrder=[...Array(W).keys()].sort((a,b)=>Math.abs(a+.5-CX)-Math.abs(b+.5-CX));
const DX=[1,1,0,-1,-1,-1,0,1],DY=[0,1,1,1,0,-1,-1,-1];
const mk=(w,h)=>{const e=document.createElement('canvas');e.width=w;e.height=h;return e};
const off=mk(W,H),octx=off.getContext('2d'),img=octx.createImageData(W,H),px=new Uint32Array(img.data.buffer);
const gl1=mk(38,65),g1=gl1.getContext('2d'),gl2=mk(19,33),g2=gl2.getContext('2d');
const pr=new Float32Array(256),pg=new Float32Array(256),pb=new Float32Array(256);
const mats=new Array(256);
function ramp(stops){for(let s=0;s<stops.length-1;s++){const[i0,h0]=stops[s],[i1,h1]=stops[s+1],a=hex(h0),b=hex(h1);for(let i=i0;i<=i1;i++){const t=i1===i0?0:(i-i0)/(i1-i0);pr[i]=a[0]+(b[0]-a[0])*t;pg[i]=a[1]+(b[1]-a[1])*t;pb[i]=a[2]+(b[2]-a[2])*t}}}
function bandsP(start,size,hexes){hexes.forEach((h,b)=>{const a=hex(h);for(let k=0;k<size;k++){const f=.9+.2*k/(size-1),i=start+b*size+k;pr[i]=a[0]*f;pg[i]=a[1]*f;pb[i]=a[2]*f}})}

/* ============ shared state ============ */
const S={T:0,dt:0,w:390,h:844,cs:1.6,gx:0,gy:0,grav:{x:0,y:1},running:true,ff:false,wind:0,windSide:1,fx:[],amb:[],flashA:0};
S.sx=x=>S.gx+x*S.cs; S.sy=y=>S.gy+y*S.cs;
let th=null,thIdx=0,dur=60,N0=1,rate=1,tokens=0,cnt=[0,0],finished=false,frame=1,flipT=-1,ageTick=0,lastSec=-1;
function newSess(){return{run:0,disturbed:false,by:{}}}
let sess=newSess(),chain=0,chainWin=0,pOv=-1;
const rowL=new Int16Array(H),rowR=new Int16Array(H);
const SIN=new Float32Array(1024);for(let k=0;k<1024;k++)SIN[k]=Math.sin(k/1024*TAU);
/* the source chamber is whichever one is physically on top right now */
let srcS=0,lastSrcS=0;

/* ============ glass geometry ============ */
function buildGlass(){
 const sh=th.shape,maxW=th.maxW,neck=1,w=new Float32Array(LEN+1);
 for(let d=0;d<=LEN;d++){const t=d/LEN;let raw;
  if(sh==='globe'){const R=(LEN-4)/2,D=LEN-R-1;raw=Math.sqrt(Math.max(0,R*R-(d-D)*(d-D)))}
  else if(sh==='cone'){raw=neck+(maxW-neck)*Math.pow(Math.min(1,t/.9),.92)}
  else if(sh==='slender'){const u=Math.max(0,(t-.03)/.74);raw=neck+(maxW-neck)*Math.pow(Math.sin(Math.min(1,u)*Math.PI/2),.7);if(t>.93)raw-=(t-.93)/.07*4}
  else{const u=Math.max(0,(t-.04)/.66);raw=neck+(maxW-neck)*Math.pow(Math.sin(Math.min(1,u)*Math.PI/2),.8);if(t>.93)raw-=(t-.93)/.07*5}
  raw=Math.max(neck,raw);if(d>0)raw=Math.min(raw,w[d-1]+.85);w[d]=raw}
 let mx=0;for(let y=0;y<H;y++){if(y<Y0||y>Y1){wRow[y]=0;continue}const d=y<MID?MID-1-y:y-MID;wRow[y]=w[Math.min(LEN,d)];mx=Math.max(mx,wRow[y])}
 th.capW=mx+8;
 for(let y=0;y<H;y++){rowL[y]=1;rowR[y]=0;for(let x=0;x<W;x++){const i=y*W+x,ww=wRow[y];if(ww>0&&Math.abs(x+.5-CX)<=ww){const dx=(x+.5-CX)/Math.max(ww,1.2);cyl[i]=.66+.34*Math.sqrt(Math.max(0,1-dx*dx));if(rowL[y]>rowR[y])rowL[y]=x;rowR[y]=x}else cyl[i]=0}}
 px.fill(0);
}
const isOpen=(x,y)=>wRow[y]>0&&Math.abs(x+.5-CX)<=wRow[y];

/* fill(p): build the glass with fraction p of the sand already poured. keep=true carries the session over (element switch, restore). */
function fill(p=0,keep=false){
 g.fill(0);c.fill(0);st.fill(0);stamp.fill(0);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!isOpen(x,y))g[y*W+x]=2;
 const span=y=>Math.max(0,rowR[y]-rowL[y]+1);
 let total=0;for(let y=Y0;y<MID;y++)total+=span(y);
 const target=total*.72;let n0=0;for(let d=0;d<=LEN&&n0<target;d++)n0+=span(MID-1-d);
 N0=n0;p=Math.max(0,Math.min(1,p));const topN=Math.round(N0*(1-p)),botN=N0-topN;
 let acc=0;for(let d=0;d<=LEN&&acc<topN;d++){const y=MID-1-d;for(const x of xOrder){if(acc>=topN)break;const i=y*W+x;if(g[i]===0){g[i]=1;c[i]=th.init();tn[i]=rnd()*255|0;acc++}}}
 let b=0;S.ff=true;for(let y=Y1;y>MID&&b<botN;y--)for(const x of xOrder){if(b>=botN)break;const i=y*W+x;if(g[i]===0){g[i]=1;tn[i]=rnd()*255|0;pOv=(b+1)/N0;c[i]=th.init();th.cross(i);st[i]=60;b++}}
 pOv=-1;S.ff=false;
 cnt[0]=acc;cnt[1]=b;rate=N0/dur;tokens=0;lastSec=-1;S.fx.length=0;
 if(srcSide()===1)rotate180(); // phone held upside down: the remaining sand goes in the chamber that is physically on top
 if(!keep){finished=false;sess=newSess();chainWin=0}
}

/* ============ simulation ============ */
const sideOf=y=>y<MID?0:1;
function moveTo(i,j,y,ny){g[j]=1;c[j]=c[i];st[j]=0;tn[j]=tn[i];stamp[j]=frame;g[i]=0;c[i]=0;st[i]=0;if(y<MID!==ny<MID){const a=sideOf(y),b=sideOf(ny);cnt[a]--;cnt[b]++;th.cross(j)}}
function mv(x,y,i,d){const nx=x+DX[d],ny=y+DY[d];if(nx<0||nx>=W||ny<0||ny>=H)return false;const j=ny*W+nx;if(g[j]!==0)return false;if((y<MID)!==(ny<MID)){if(!S.running||finished||tokens<1)return false;tokens-=1}moveTo(i,j,y,ny);return true}
function step(base,frac){
 frame=(frame+1)&255;if(frame===0)frame=1;
 // scan against gravity so a falling column moves together, whichever way the phone points
 const down=S.grav.y>=0,yA=down?Y1:Y0,yB=down?Y0-1:Y1+1,ys=down?-1:1,gx=S.grav.x,ltr=gx>.3?false:gx<-.3?true:(frame&1)===0;
 for(let y=yA;y!==yB;y+=ys){const row=y*W,L=rowL[y],R=rowR[y],n=R-L+1;for(let k=0;k<n;k++){const x=ltr?L+k:R-k,i=row+x;if(g[i]!==1||stamp[i]===frame)continue;
  const m=mats[c[i]];
  if(m.moveP<1&&rnd()>m.moveP){if(st[i]<255)st[i]++;continue}
  const d=(base+(rnd()<frac?1:0))&7;
  if(m.windP>0&&rnd()<m.windP&&mv(x,y,i,(d+S.windSide+8)&7))continue;
  if(mv(x,y,i,d))continue;
  if(rnd()<m.slideP){const s=rnd()<.5?1:-1;if(mv(x,y,i,(d+s+8)&7))continue;if(mv(x,y,i,(d-s+8)&7))continue}
  if(m.spread>0){let moved=false;const s0=rnd()<.5?2:-2;for(let q=0;q<2&&!moved;q++){const dir=(d+(q?-s0:s0)+8)&7;let tx=x,ty=y,tj=-1;for(let k2=0;k2<m.spread;k2++){tx+=DX[dir];ty+=DY[dir];if(tx<0||tx>=W||ty<0||ty>=H)break;const j=ty*W+tx;if(g[j]!==0||(ty<MID)!==(y<MID))break;tj=j}if(tj>=0){moveTo(i,tj,y,(tj/W)|0);moved=true}}if(moved)continue}
  if(st[i]<255)st[i]++}}
}
function rotate180(){for(let i=0,j=N-1;i<j;i++,j--){let t=g[i];g[i]=g[j];g[j]=t;t=c[i];c[i]=c[j];c[j]=t;t=st[i];st[i]=st[j];st[j]=t;t=tn[i];tn[i]=tn[j];tn[j]=t}const t=cnt[0];cnt[0]=cnt[1];cnt[1]=t}
/* catch up after the app was in the background: move sand from the far end of the upper chamber to the far end of the lower one */
function fastForward(sec){const s=srcSide(),d=1-s;let k=Math.min(cnt[s],Math.round(rate*sec));if(k<=0)return;S.ff=true;const used=k/rate;sess.run+=used;sess.by[th.id]=(sess.by[th.id]||0)+used;
 let removed=0;const rem=(y)=>{for(let x=0;x<W&&removed<k;x++){const i=y*W+x;if(g[i]===1){g[i]=0;c[i]=0;st[i]=0;removed++}}};
 if(s===0){for(let y=Y0;y<MID&&removed<k;y++)rem(y)}else{for(let y=Y1;y>=MID&&removed<k;y--)rem(y)}
 let added=0;const add=(y)=>{for(const x of xOrder){if(added>=removed)break;const i=y*W+x;if(g[i]===0&&isOpen(x,y)){g[i]=1;tn[i]=rnd()*255|0;c[i]=th.init();th.cross(i);st[i]=60;added++}}};
 if(d===1){for(let y=Y1;y>MID&&added<removed;y--)add(y)}else{for(let y=Y0;y<MID-1&&added<removed;y++)add(y)}

function paintSand(){const up=S.grav.y>=0?-W:W,rimB=th.rim,sh=th.shade,ta=th.tone,tb=1-ta/2,tk=ta/255;
 for(let y=Y0;y<=Y1;y++){const L=rowL[y],R=rowR[y];let i=y*W+L;for(let x=L;x<=R;x++,i++){if(g[i]!==1){px[i]=0;continue}const k=c[i];let f=cyl[i]*(tb+tn[i]*tk);if(g[i+up]===0)f*=rimB;if(sh)f=sh(i,f,x,y);
  let r=pr[k]*f,gg=pg[k]*f,b=pb[k]*f;if(r>255)r=255;if(gg>255)gg=255;if(b>255)b=255;px[i]=(4278190080|(b<<16)|(gg<<8)|r)>>>0}}
 octx.putImageData(img,0,0)}
let bgFade=0;
function draw(){bgFade=Math.min(1,bgFade+S.dt*1.8);paintSand();
 const cx=S.sx(CX),cy=S.sy(MID),{botY,sw}=GR.g,GW=W*S.cs,GH=H*S.cs;
 const flipTf=x=>{if(flipT>=0){const e=ease(Math.min(1,flipT)),sc=1-.05*Math.sin(Math.PI*e);x.translate(cx,cy);x.rotate(Math.PI*e);x.scale(sc,sc);x.translate(-cx,-cy)}};
 // soft layer: backdrop, floor shadow, ember light and the sand's bloom
 const b=bctx;b.setTransform(bdpr,0,0,bdpr,0,0);drawBg(b);
 b.save();zoomTf(b);
 b.save();b.translate(0,botY+6);b.scale(1,.12);b.translate(0,-(botY+6));b.fillStyle=GR.sh;b.fillRect(cx-sw,botY+6-sw,sw*2,sw*2);b.restore();
 if(th.id==='ignis'){b.globalAlpha=.16+.04*Math.sin(S.T*2);b.fillStyle=GR.lava;b.fillRect(cx-sw*1.2,botY-sw*1.2,sw*2.4,sw*2.4);b.globalAlpha=1}
 if(th.glow){g1.clearRect(0,0,38,65);g1.drawImage(off,0,0,38,65);g2.clearRect(0,0,19,33);g2.drawImage(gl1,0,0,19,33);b.save();flipTf(b);b.globalCompositeOperation='lighter';b.imageSmoothingEnabled=true;b.globalAlpha=th.glow*.8;b.drawImage(gl1,S.gx-S.cs*3,S.gy-S.cs*3,GW+S.cs*6,GH+S.cs*6);b.globalAlpha=th.glow*.6;b.drawImage(gl2,S.gx-S.cs*10,S.gy-S.cs*10,GW+S.cs*20,GH+S.cs*20);b.restore()}
 b.restore();
 // sharp layer: the hourglass
 const x=ctx;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cv.width,cv.height);x.setTransform(dpr,0,0,dpr,0,0);
 x.save();zoomTf(x);flipTf(x);
 x.drawImage(backC,box.x,box.y,box.w,box.h);
 x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(off,S.gx,S.gy,GW,GH);
 drawFx(x);
 x.drawImage(frontC,box.x,box.y,box.w,box.h);
 x.restore();
 if(S.flashA>.005){x.fillStyle=rgba(th.accent,S.flashA);x.fillRect(0,0,S.w,S.h);S.flashA*=Math.pow(.05,S.dt)}
 if(snapT>0){x.setTransform(1,0,0,1,0,0);x.globalAlpha=ease(snapT);x.drawImage(snap,0,0);x.globalAlpha=1;snapT=Math.max(0,snapT-S.dt/(reduce?.15:.5))}}

/* ============ UI ============ */
const DURS=[1,3,5,10,25,45],DMIN=10,DMAX=3*3600;
const okDur=s=>typeof s==='number'&&s>=DMIN&&s<=DMAX;
const tabs=$('tabs'),durs=$('durs');
ELS.forEach((e,i)=>{const b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('aria-label',`${e.latin}, ${e.name}`);b.title=e.latin;b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH[e.id]}</svg>`;b.onclick=()=>{if(i!==thIdx)setEl(i)};tabs.appendChild(b)});
function setDur(s){dur=s;db.dur=dur;saveDb();fill(0);S.running=true;wake();syncCtrl();saveState()}
DURS.forEach(m=>{const b=document.createElement('button');b.type='button';b.className='dur';b.textContent=m;b.dataset.s=m*60;b.setAttribute('aria-label',m+' minute'+(m>1?'s':''));b.onclick=()=>setDur(m*60);durs.appendChild(b)});
const PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const cBtn=document.createElement('button');cBtn.type='button';cBtn.className='dur custom';cBtn.id='customBtn';cBtn.setAttribute('aria-label','Custom time');cBtn.innerHTML=PLUS;cBtn.onclick=()=>openTime();durs.appendChild(cBtn);
const fmt=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:String(m).padStart(2,'0')+':'+x};
const short=s=>{const m=Math.floor(s/60),x=s%60;return x?m+':'+String(x).padStart(2,'0'):String(m)};
/* custom time: any length from 10 seconds to 3 hours */
let tLast=null;
function openTime(){tLast=document.activeElement;const s=okDur(db.custom)?db.custom:dur;$('tMin').value=Math.floor(s/60);$('tSec').value=String(s%60).padStart(2,'0');$('terr').textContent='';$('tsheet').hidden=false;setTimeout(()=>{$('tMin').focus();$('tMin').select()},50)}
function closeTime(){$('tsheet').hidden=true;tLast&&tLast.focus&&tLast.focus()}
const digits=el=>{el.value=el.value.replace(/\D/g,'')};
['tMin','tSec'].forEach(id=>$(id).addEventListener('input',e=>digits(e.target)));
$('tSec').addEventListener('blur',e=>{const v=Math.min(59,+e.target.value||0);e.target.value=String(v).padStart(2,'0')});
document.querySelectorAll('.tquick button').forEach(b=>b.onclick=()=>{const a=+b.dataset.a,cur=(+$('tMin').value||0)*60+Math.min(59,+$('tSec').value||0),n=Math.max(DMIN,Math.min(DMAX,cur+a*60));$('tMin').value=Math.floor(n/60);$('tSec').value=String(n%60).padStart(2,'0');$('terr').textContent=''});
$('tform').addEventListener('submit',e=>{e.preventDefault();const s=(+$('tMin').value||0)*60+Math.min(59,+$('tSec').value||0);if(s<DMIN){$('terr').textContent='Set at least 10 seconds';return}if(s>DMAX){$('terr').textContent='The longest glass is 3 hours';return}db.custom=s;closeTime();setDur(s)});
$('closeT').onclick=closeTime;$('tsheet').addEventListener('click',e=>{if(e.target.id==='tsheet')closeTime()});
$('time').addEventListener('click',()=>{if(!focus)openTime()});$('time').setAttribute('role','button');$('time').tabIndex=0;$('time').title='Set a custom time';
$('time').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();openTime()}});
const PAUSE='<rect x="7" y="5" width="3" height="14" rx=".8"/><rect x="14" y="5" width="3" height="14" rx=".8"/>',PLAY='<path d="M8 5.5v13l10.5-6.5z"/>';
function syncCtrl(){[...tabs.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===thIdx));[...durs.querySelectorAll('.dur:not(.custom)')].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===dur));
 const isCustom=!DURS.includes(dur/60);cBtn.setAttribute('aria-pressed',isCustom);if(isCustom){cBtn.textContent=short(dur);cBtn.setAttribute('aria-label','Custom time, '+short(dur)+' minutes. Change')}else{cBtn.innerHTML=PLUS;cBtn.setAttribute('aria-label','Custom time')}
 const run=S.running&&!finished;$('playIc').innerHTML=run?PAUSE:PLAY;$('playBtn').setAttribute('aria-label',finished?'Start again':run?'Pause':'Resume')}
function renderMeta(){$('codexBtn').setAttribute('aria-label',`Open the Codex, ${Object.values(db.ess).reduce((a,b)=>a+b,0)} essence`)}
let lt='',ls='',lp=-1;
function updateUI(){const rem=cnt[srcSide()]/rate,t=fmt(rem);if(t!==lt){$('time').textContent=t;$('ftime').textContent=t;lt=t;gl.setAttribute('aria-label',`${th.name} hourglass, ${t} left`)}
 const s=finished?(chainWin>0?'Flip to chain · '+Math.ceil(chainWin):'Complete'):(!S.running?'Paused':'');
 if(s!==ls){$('status').textContent=s;ls=s}
 const off=216.8*(1-progress());if(Math.abs(off-lp)>.3){$('prog').setAttribute('stroke-dashoffset',off.toFixed(1));lp=off}
 const bt=chain>0?'Chain ×'+chain:'';if(bt!==lb){$('badge').textContent=bt;lb=bt}}
let lb='';
/* Switching element keeps the session: same time left, same running/paused state, same chain. */
function setEl(i,first){
 const p=first?0:progress(),wasRun=S.running,wasFin=finished,cw=chainWin;
 if(!first&&cv.width>2){snap.width=cv.width;snap.height=cv.height;const sx=snap.getContext('2d');sx.drawImage(bgc,0,0,cv.width,cv.height);sx.drawImage(cv,0,0);snapT=1}
 thIdx=i;th=ELS[i];db.el=i;saveDb();for(let k=0;k<256;k++){pr[k]=pg[k]=pb[k]=0;mats[k]=th.mat}th.pal();th.mat.slideP=th.id==='mons'?.3:th.mat.slideP;buildGlass();
 S.amb=Array.from({length:th.amb.n},()=>th.amb.mk());const g0=targetGrav();S.grav.x=g0.x;S.grav.y=g0.y;gAng=Math.atan2(g0.y,g0.x);
 if(first){fill(0,false);S.running=true;bgFade=0}else{fill(p,true);S.running=wasRun;finished=wasFin;chainWin=cw}
 document.documentElement.style.setProperty('--accent',th.accent);layout();renderMeta();syncCtrl();saveState()}
$('playBtn').onclick=()=>{if(finished){fill(0);S.running=true}else{S.running=!S.running;if(!S.running)sess.disturbed=true;else wake()}syncCtrl();saveState()};
$('resetBtn').onclick=()=>{fill(0);S.running=false;syncCtrl();saveState()};
/* timer state survives closing the app */
const STK='zambaara.state.v1';
function saveState(){if(!th)return;try{localStorage.setItem(STK,JSON.stringify({el:thIdx,dur,p:progress(),running:S.running,finished,at:Date.now(),sess,chain}))}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState()});addEventListener('pagehide',saveState);

/* ============ music ============
   The Zambaara theme plays while the sand runs: it fades in when the glass pours, fades out when paused
   or complete, and picks up where it left off. Loops gaplessly with a short crossfade. */
const MUSIC_SRC='audio/zambaara.mp3',VOL=.8,XF=1.8;
let actx=null,mBuf=null,mGain=null,mLoading=false,mStarted=false,mNext=0,mPlaying=false,mTok=0,mFail=false;
let musicOn=db.music!==false;
function syncMusicBtn(){for(const id of['musicBtn','fMusic']){const b=$(id);b.setAttribute('aria-pressed',musicOn);b.setAttribute('aria-label',musicOn?'Music on. Turn off':'Music off. Turn on')}}
function unlockAudio(){
 if(actx){if(actx.state!=='running'&&musicWant())actx.resume().catch(()=>{});return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC){mFail=true;return}
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}
 try{actx=new AC();mGain=actx.createGain();mGain.gain.value=0;mGain.connect(actx.destination);
  const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0)}catch(_){mFail=true;return}
 loadMusic()}
function loadMusic(){if(mBuf||mLoading||!actx)return;mLoading=true;
 fetch(MUSIC_SRC).then(r=>{if(!r.ok)throw new Error('music '+r.status);return r.arrayBuffer()})
  .then(ab=>new Promise((res,rej)=>actx.decodeAudioData(ab,res,rej)))
  .then(buf=>{mBuf=buf;mLoading=false}).catch(e=>{mLoading=false;mFail=true;console.warn(e)})}
function queueCopy(at,first){const s=actx.createBufferSource(),g=actx.createGain(),d=mBuf.duration;s.buffer=mBuf;s.connect(g);g.connect(mGain);
 g.gain.setValueAtTime(first?1:0,at);if(!first)g.gain.linearRampToValueAtTime(1,at+XF*.7);
 g.gain.setValueAtTime(1,at+d-XF);g.gain.linearRampToValueAtTime(0,at+d);
 s.start(at);s.stop(at+d+.05);s.onended=()=>{try{s.disconnect();g.disconnect()}catch(_){}}}
function musicWant(){return musicOn&&!mFail&&S.running&&!finished&&!document.hidden}
function musicSet(play){if(!actx||!mBuf||play===mPlaying)return;mPlaying=play;const tok=++mTok;
 if(play){actx.resume().then(()=>{if(tok!==mTok)return;const n=actx.currentTime;
   if(!mStarted){mStarted=true;queueCopy(n+.05,true);mNext=n+.05+mBuf.duration-XF}
   mGain.gain.cancelScheduledValues(n);mGain.gain.setValueAtTime(mGain.gain.value,n);mGain.gain.linearRampToValueAtTime(VOL,n+1.4)}).catch(()=>{mPlaying=false})}
 else{const n=actx.currentTime;mGain.gain.cancelScheduledValues(n);mGain.gain.setValueAtTime(mGain.gain.value,n);mGain.gain.linearRampToValueAtTime(0,n+.8);
   setTimeout(()=>{if(tok===mTok&&!mPlaying&&actx.state==='running')actx.suspend().catch(()=>{})},900)}}
function musicTick(){if(!actx||!mBuf)return;musicSet(musicWant());
 if(mStarted&&actx.state==='running'&&mNext<actx.currentTime+1){queueCopy(mNext,false);mNext+=mBuf.duration-XF}}
function toggleMusic(){musicOn=!musicOn;db.music=musicOn;saveDb();syncMusicBtn();if(musicOn){unlockAudio();if(!S.running||finished)onceTip('zmb.tip.music','Music plays while the sand runs')}}
$('musicBtn').onclick=toggleMusic;$('fMusic').onclick=toggleMusic;
// browsers only allow sound after a tap: start (or resume) the audio on any touch, click or key
for(const ev of['touchend','click','keydown'])document.addEventListener(ev,()=>{if(musicOn)unlockAudio()},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&actx&&mPlaying){mTok++;mPlaying=false;try{mGain.gain.cancelScheduledValues(0);mGain.gain.value=0}catch(_){}actx.suspend().catch(()=>{})}});
syncMusicBtn();
$('flipBtn').onclick=()=>flip();
let wl=null;function wake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null})}).catch(()=>{})}catch(_){}}
/* codex */
let lastFocus=null;
function openCodex(){lastFocus=document.activeElement;renderCodex();$('sheet').hidden=false;$('closeCodex').focus()}
function closeCodex(){$('sheet').hidden=true;lastFocus&&lastFocus.focus&&lastFocus.focus()}
$('codexBtn').onclick=openCodex;$('closeCodex').onclick=closeCodex;$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeCodex()});
function renderCodex(){$('stEss').textContent=Object.values(db.ess).reduce((a,b)=>a+b,0);$('stStreak').textContent=db.streak.n;$('stChain').textContent=db.bestChain;
 $('erows').innerHTML=ELS.map(e=>{const l=level(e.id),nx=TH[l+1],v=db.ess[e.id],pc=nx?Math.min(100,(v-TH[l])/(nx-TH[l])*100):100,fi=finishOf(e.id);
  return`<div class="erow" style="--ec:${e.accent}"><svg viewBox="0 0 24 24" fill="none" stroke="${e.accent}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH[e.id]}</svg><div><div class="nm">${e.latin}<small>${e.name}</small></div><div class="bar"><i style="width:${pc}%"></i></div><div class="meta">${v}${nx?' / '+nx:''} essence · ${db.done[e.id]} glass${db.done[e.id]===1?'':'es'} emptied</div><div class="fins">${FINISH.map((F,k)=>`<button type="button" class="fin" data-e="${e.id}" data-k="${k}" aria-pressed="${k===fi}" ${k>l?'disabled':''}>${F[0]}</button>`).join('')}</div></div><div class="lv">${ROMAN[l]}</div></div>`}).join('');
 $('erows').querySelectorAll('.fin').forEach(b=>b.onclick=()=>{db.fin[b.dataset.e]=+b.dataset.k;saveDb();renderCodex();if(b.dataset.e===th.id){buildLayers();renderMeta()}});
 $('seals').innerHTML=SEALS.map(s=>{const on=!!db.seals[s.id];return`<div class="seal${on?'':' off'}">${sealSvg(s,on,th.accent)}<b>${s.name}</b><span>${s.cond}</span></div>`}).join('')}

/* ============ loop ============ */
let last=performance.now(),simAcc=0,saveT=0;
/* the frame loop always schedules the next frame first, so one bad frame can never freeze the app */
let errN=0;
function loop(now){requestAnimationFrame(loop);try{tick(now)}catch(e){errN++;if(errN<5)console.error(e);S.fx.length=0;snapT=0;cv.width=cv.width;bgc.width=bgc.width}}
function tick(now){let raw=(now-last)/1000;last=now;
 if(raw>.3&&S.running&&!finished&&flipT<0){fastForward(raw);raw=.016}
 const dt=Math.min(.05,Math.max(0,raw));S.dt=dt;S.T+=dt;
 if(!dragging&&Math.abs(dragAng)>.05)dragAng*=Math.pow(.015,dt);
 // gravity turns by angle (never by averaging vectors, which stalls when the phone is turned straight over)
 const tg=targetGrav();const kk=1-Math.exp(-dt/.07);let da=Math.atan2(tg.y,tg.x)-gAng;da=Math.atan2(Math.sin(da),Math.cos(da));gAng+=da*kk;S.grav.x=Math.cos(gAng);S.grav.y=Math.sin(gAng);
 if(zoomT<1)zoomT=Math.min(1,zoomT+dt/(reduce?.2:.7));fAmt+=((focus?1:0)-fAmt)*(1-Math.exp(-dt/.18));
 if(flipT>=0){flipT+=dt/(reduce?.35:.95);if(flipT>=1){flipT=-1;onFlipped()}}
 else{if(S.running&&!finished){tokens=Math.min(tokens+rate*dt,Math.max(2,rate*.3));sess.run+=dt;sess.by[th.id]=(sess.by[th.id]||0)+dt}
  let a=Math.atan2(S.grav.y,S.grav.x)/(Math.PI/4);if(a<0)a+=8;const base=Math.floor(a),frac=a-base;
  simAcc+=dt*60*(th.subs||2);let subs=Math.min(8,Math.floor(simAcc));simAcc-=subs;subs+=Math.min(4,Math.floor(tokens/3));for(let s=0;s<subs;s++)step(base,frac);
  if(th.age&&(++ageTick%3===0))for(let y=Y0;y<=Y1;y++){const e=y*W+rowR[y];for(let i=y*W+rowL[y];i<=e;i++)if(g[i]===1)th.age(i)}}
 th.every&&th.every();
 if(chainWin>0){chainWin-=dt;if(chainWin<=0){chainWin=0;chain=0}}
 const sNow=srcSide();if(sNow!==lastSrcS){lastSrcS=sNow;if(sensor.on){try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}}}
 if(finished&&flipT<0&&Math.abs(S.grav.y)>.35&&cnt[sNow]>0)resumeFlip();
 if(S.running&&!finished&&flipT<0&&Math.abs(S.grav.y)>.2&&cnt[sNow]===0){finished=true;S.running=false;S.flashA=reduce?0:.12;award();chainWin=6;burst(30,[th.accent,'#ffffff']);try{navigator.vibrate&&navigator.vibrate([24,60,24])}catch(_){}syncCtrl();saveState()}
 saveT+=dt;if(saveT>1){saveT=0;saveState()}
 draw();updateUI();musicTick()}

let st0=null;try{st0=JSON.parse(localStorage.getItem(STK)||'null')}catch(_){}
if(st0&&okDur(st0.dur))dur=st0.dur;else if(okDur(db.dur))dur=db.dur;
const i0=st0&&st0.el>=0&&st0.el<4?st0.el:(db.el>=0&&db.el<4?db.el:0);
th=ELS[i0];th.pal();buildGlass();
setEl(i0,true);
if(st0&&typeof st0.p==='number'){
 let p=st0.p;sess=Object.assign(newSess(),st0.sess||{});if(!sess.by)sess.by={};chain=st0.chain||0;
 const live=st0.running&&!st0.finished;
 if(live){const away=Math.max(0,(Date.now()-st0.at)/1000),used=Math.min(away,(1-p)*dur);p=Math.min(1,p+used/dur);sess.run+=used;sess.by[th.id]=(sess.by[th.id]||0)+used}
 fill(p,true);S.running=!!st0.running;finished=!!st0.finished;
 if(live&&p>=1){finished=true;S.running=false;award()}
 syncCtrl();saveState()}
attach();updHint();
requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
